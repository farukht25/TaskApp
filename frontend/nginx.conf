server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Stream logs to Docker so `docker compose logs` shows frontend output
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Enable gzip for faster asset delivery
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # Cache policy: long cache for hashed assets; no-cache for index.html
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # Ensure index.html is always revalidated to pick new bundles
        if ($request_uri = "/") {
            add_header Cache-Control "no-cache";
        }
        try_files $uri $uri/ /index.html;
    }
}
